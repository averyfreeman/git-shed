name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate Go module tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Go module releases require a stable SemVer tag such as v0.1.0; got $TAG" >&2
            exit 1
          fi
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-pkg:
    needs: linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build native macOS binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist/pkgroot/usr/local/bin
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/pkgroot/usr/local/bin/git-shed .
          chmod 755 dist/pkgroot/usr/local/bin/git-shed
          dist/pkgroot/usr/local/bin/git-shed version
      - name: Build installer package
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          sudo xattr -cr dist/pkgroot
          if xattr -lr dist/pkgroot | grep -q .; then
            echo "package staging still has extended attributes" >&2
            exit 1
          fi
          pkgbuild \
            --root dist/pkgroot \
            --identifier com.github.averyfreeman.git-shed \
            --version "$VERSION" \
            --install-location / \
            "dist/git-shed_${VERSION}_darwin_${ARCH}.pkg"
          shasum -a 256 "dist/git-shed_${VERSION}_darwin_${ARCH}.pkg" > "dist/git-shed_${VERSION}_darwin_${ARCH}.pkg.sha256"
      - name: Upload macOS package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${TAG#v}"
          gh release upload "$TAG" dist/git-shed_"$VERSION"_darwin_"$ARCH".pkg dist/git-shed_"$VERSION"_darwin_"$ARCH".pkg.sha256 --clobber

  publish:
    needs: macos-pkg
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  go-module-index:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Request Go module proxy indexing
        env:
          TAG: ${{ github.ref_name }}
        run: |
          module_path="$(go list -m)"
          for attempt in $(seq 1 12); do
            if GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go list -m "${module_path}@${TAG}"; then
              exit 0
            fi
            echo "Go proxy has not indexed ${module_path}@${TAG} yet (attempt ${attempt}/12)"
            sleep 10
          done
          echo "Go proxy did not index ${module_path}@${TAG} after 120 seconds" >&2
          exit 1
