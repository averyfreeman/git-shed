schema_version: 1.0.0
version: 1
# For every substantive change, commit and release after validation, then push
# the branch and its tag to origin. Use major for breaking changes, minor for
# new features, and patch for other substantive changes. Keep Go tags prefixed
# with "v" (vMAJOR.MINOR.PATCH). Never force-push.
profile: autonomous
branch: main
versioning: semver
initial_tag: v0.1.0
commit_style: conventional-commits
semantic_release: true
actions:
    init: true
    branch: true
    stage: true
    commit: true
    tag: true
    remote: true
    push: true
remote:
    provider: github
    owner: averyfreeman
    name: git-shed
    visibility: public
    alias: origin
    status: configured
    url: https://github.com/averyfreeman/git-shed.git
